[pytest]
# `pipecat_stubs` does not exist in this checkout (nor do services/, config/, bench/) — it is a
# leftover from the pre-port Pipecat repo. Harmless to pytest, but listed here so the next reader
# does not go looking for a directory that was never here.
pythonpath = . pipecat_stubs
testpaths = tests

# EXPLICIT WHITELIST, not a glob — a file absent from this line does not run in `make gate`.
#
# Removed 2026-07-27 (ADR-030, human sign-off recorded in state/BLOCKERS.md):
#   test_tts.py     -> imports `services.tts_cache`; `services/` does not exist
#   test_harness.py -> imports `config` via tests/helpers.py; `config/` does not exist
# Both are the retired CER harness. Files kept on disk deliberately — excluded, not deleted, so
# the evidence survives if the harness is ever revived. Their import errors were the entire gate
# blocker: ONE collection error interrupts the whole run, so `make test` reported nothing at all
# rather than "57 passed".
#
# Added 2026-07-27 — each measured green before being added (19 passed, 0 failed):
#   test_phase4_portal_api.py   the tenant portal API = the dashboard's backend, incl. the
#                               stale-session regression test guarding the "13 live calls" bug
#   test_machine_agent_api.py   HMAC-signed /machine/agents surface
#   test_phase2.py              DB secret provider + admin secret rotation
#   test_phase4_voice_picker.py voice catalogue
# Until then the gate ran the two DEAD files and skipped these 19 live ones.
#
# Deliberately NOT added:
#   test_phase8_prod.py  imports the missing `bench` package — would reintroduce a collection error
#   any tests/*_live.py  these spend real money on Uplift/Gemini/LiveKit; never in the gate
python_files = test_isolation.py test_mint.py test_worker.py test_admin.py test_phase0.py test_host_backend_contract.py test_phase2.py test_phase4_portal_api.py test_phase4_voice_picker.py test_machine_agent_api.py conftest.py
