name: Release SDK

# Publishes @awaazlabs-uva/voice (sdk/), @awaazlabs-uva/agents (sdk-server/) and
# @awaazlabs-uva/telephony (telephony/) to npm.
#
# Release a package by pushing a tag whose version matches its package.json:
#   voice-v<version>      -> @awaazlabs-uva/voice   (sdk-v<version> is kept as an alias)
#   agents-v<version>     -> @awaazlabs-uva/agents
#   telephony-v<version>  -> @awaazlabs-uva/telephony
# The same PR that bumps `version` must add a `## [<version>]` section to that package's
# CHANGELOG.md. workflow_dispatch runs the same checks as a dry run and never publishes.
#
# Publishing is from the canonical repository only: package.json repository.url
# must match the repository running this workflow. Legacy token auth is the
# default. Set Actions variable NPM_PUBLISH_AUTH=trusted only after registering
# the package's Trusted Publisher on npm. Trusted mode uses short-lived OIDC.
# Provenance is disabled for this private source repository.

on:
  push:
    tags:
      - "voice-v*"
      - "agents-v*"
      - "telephony-v*"
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to verify (dry run — nothing is published)"
        required: true
        type: choice
        options:
          - voice
          - agents
          - telephony

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish SDK package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing
    env:
      NPM_PUBLISH_AUTH: ${{ vars.NPM_PUBLISH_AUTH || 'token' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve package and version
        id: target
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          publish=false
          tag_version=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            publish=true
            case "$GITHUB_REF_NAME" in
              voice-v*)  package=voice;  tag_version="${GITHUB_REF_NAME#voice-v}" ;;
              sdk-v*)    package=voice;  tag_version="${GITHUB_REF_NAME#sdk-v}" ;;
              agents-v*) package=agents; tag_version="${GITHUB_REF_NAME#agents-v}" ;;
              telephony-v*) package=telephony; tag_version="${GITHUB_REF_NAME#telephony-v}" ;;
              *) echo "::error::Unrecognised release tag '$GITHUB_REF_NAME'"; exit 1 ;;
            esac
          else
            package="$INPUT_PACKAGE"
          fi
          case "$package" in
            voice)  dir=sdk ;;
            agents) dir=sdk-server ;;
            telephony) dir=telephony ;;
            *) echo "::error::Unknown package '$package'"; exit 1 ;;
          esac

          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if [ -n "$tag_version" ] && [ "$tag_version" != "$version" ]; then
            echo "::error::Tag version $tag_version does not match $dir/package.json version $version"
            exit 1
          fi

          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $name@$version from $dir/ (publish=$publish)"

      - name: Check repository and changelog
        env:
          DIR: ${{ steps.target.outputs.dir }}
          VERSION: ${{ steps.target.outputs.version }}
          PUBLISH: ${{ steps.target.outputs.publish }}
        run: |
          set -euo pipefail
          repo_url=$(node -p "require('./$DIR/package.json').repository.url")
          expected="git+https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$repo_url" != "$expected" ]; then
            msg="$DIR/package.json repository.url is $repo_url but this workflow runs in $GITHUB_REPOSITORY"
            if [ "$PUBLISH" = "true" ]; then echo "::error::$msg — publish from the canonical repository"; exit 1; fi
            echo "::warning::$msg — a real release from here would be rejected"
          fi
          if ! grep -qF "## [$VERSION]" "$DIR/CHANGELOG.md"; then
            msg="$DIR/CHANGELOG.md has no '## [$VERSION]' section"
            if [ "$PUBLISH" = "true" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg — add it before tagging"
          fi

      - name: Validate publish authentication mode
        run: |
          case "$NPM_PUBLISH_AUTH" in
            token|trusted) ;;
            *) echo "::error::NPM_PUBLISH_AUTH must be token or trusted"; exit 1 ;;
          esac

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set up OIDC-capable npm CLI
        if: env.NPM_PUBLISH_AUTH == 'trusted'
        run: npm install --global npm@11.6.2

      - name: Install, build, lint and test
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      - name: Check version is not already published
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
          PUBLISH: ${{ steps.target.outputs.publish }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            msg="$NAME@$VERSION is already on npm — bump the version"
            if [ "$PUBLISH" = "true" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"
          fi

      - name: Check license metadata and packaged terms
        if: steps.target.outputs.publish == 'true'
        env:
          DIR: ${{ steps.target.outputs.dir }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.DIR;
          const pkg = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
          if (typeof pkg.license !== 'string' || !pkg.license.trim()) {
            console.error('::error::Set owner-approved package license metadata before publishing.');
            process.exit(1);
          }
          const terms = path.join(dir, 'LICENSE');
          if (!fs.existsSync(terms) || !fs.readFileSync(terms, 'utf8').trim()) {
            console.error('::error::Include the approved LICENSE in the package directory before publishing.');
            process.exit(1);
          }
          NODE

      - name: Check npm credentials
        if: steps.target.outputs.publish == 'true' && env.NPM_PUBLISH_AUTH == 'token'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set — nothing was published"
            exit 1
          fi

      - name: Publish to npm
        if: steps.target.outputs.publish == 'true' && env.NPM_PUBLISH_AUTH == 'token'
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
        # The source repository remains private.
        run: npm publish --access public

      - name: Publish via npm Trusted Publishing
        if: steps.target.outputs.publish == 'true' && env.NPM_PUBLISH_AUTH == 'trusted'
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "false"
        run: npm publish --access public

      - name: Dry-run publish
        if: steps.target.outputs.publish != 'true'
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --dry-run --access public
