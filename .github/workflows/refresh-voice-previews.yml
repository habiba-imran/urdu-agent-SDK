name: Refresh Voice Preview URLs

# voices.preview_url stores a Supabase Storage signed URL with a 7-day TTL
# (scripts/upload_voice_previews.py). Nothing else refreshes it, so it goes stale on its own —
# this reruns scripts/resign_voice_previews.py on a schedule well inside that window so the
# dashboard/voice-picker's preview playback never silently breaks again.
on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days, well inside the 7-day signed-URL TTL
  workflow_dispatch: {}

jobs:
  resign:
    name: Re-sign Voice Preview URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Re-sign Preview URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/resign_voice_previews.py
