name: Deploy to Staging

# F-H3: see .github/workflows/deploy-prod.yml. Staging deploys now wait for the CI Pipeline
# workflow to succeed on the same commit, and a missing deploy hook fails the job instead of
# producing a green run that deployed nothing.

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [staging, dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy is being run by hand (recorded in the run log)"
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Trigger Render Staging Deploys
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Record what is being deployed
        env:
          REASON: ${{ inputs.reason }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual staging deploy. Reason: ${REASON:-(none given)}"
          else
            echo "Deploying $SOURCE_SHA from $SOURCE_BRANCH after a successful CI run"
          fi

      - name: Deploy Staging Control Plane
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_CONTROL_PLANE_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_CONTROL_PLANE_STAGING is not set - nothing was deployed"
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$HOOK_URL" >/dev/null

      - name: Deploy Staging Voice Worker
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_WORKER_STAGING is not set - nothing was deployed"
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$HOOK_URL" >/dev/null

      - name: Deploy Staging Admin Portal
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_ADMIN_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_ADMIN_STAGING is not set - nothing was deployed"
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$HOOK_URL" >/dev/null

      - name: Deploy Staging Tenant Portal API
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_TENANT_PORTAL_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_TENANT_PORTAL_STAGING is not set - the tenant portal was NOT deployed and must be updated by hand"
            exit 0
          fi
          curl -sS --fail-with-body -X POST "$HOOK_URL" >/dev/null
