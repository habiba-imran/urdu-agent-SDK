name: CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  # --- Job 1: Python Test Suite ---
  pytest:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Test Suite
        env:
          LIVEKIT_URL: "wss://test.livekit.cloud"
          LIVEKIT_API_KEY: "test-key"
          LIVEKIT_API_SECRET: "test-secret"
          SUPABASE_DB_URL: "postgresql://test:test@localhost:5432/test"
          CP_TENANT_SECRETS: "{}"
        run: python -m pytest tests/ -v --tb=short

  # --- Job 2: SDK Package Build & Lint ---
  sdk-build:
    name: SDK Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & Lint SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build
          npm run lint

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/

  # --- Job 3: Example Web App Build Check ---
  example-app-build:
    name: Example App Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Basic Web Client Example
        working-directory: examples/basic-web-client
        run: |
          npm ci
          npm run build

  # --- Job 4: Docker Container Build Smoke Test ---
  docker-smoke:
    name: Docker Container Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Control Plane Docker Image
        run: docker build -f docker/control-plane.Dockerfile -t uva-control-plane:test .

      - name: Build Worker Docker Image
        run: docker build -f docker/worker.Dockerfile -t uva-worker:test .

      - name: Build Admin Docker Image
        run: docker build -f docker/admin.Dockerfile -t uva-admin:test .
