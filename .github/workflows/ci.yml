name: CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  # --- Job 1: Python Test Suite ---
  pytest:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Test Suite
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL || 'wss://test.livekit.cloud' }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY || 'test-key' }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET || 'test-secret' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || 'postgresql://test:test@localhost:5432/test' }}
          CP_TENANT_SECRETS: "{}"
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL secret provided. Running full live test suite..."
            python -m pytest tests/ -v --tb=short
          else
            echo "SUPABASE_DB_URL secret not set. Running unit test suite..."
            python -m pytest tests/test_phase0.py -v --tb=short
          fi

  # --- Job 2: SDK Packages Build, Lint & Test ---
  sdk-build:
    name: SDK Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build, Lint & Test Browser SDK (@awaazlabs-uva/voice)
        working-directory: sdk
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      - name: Build, Lint & Test Server SDK (@awaazlabs-uva/agents)
        working-directory: sdk-server
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build, Lint & Test Telephony SDK (@awaazlabs-uva/telephony)
        working-directory: telephony
        run: |
          npm ci
          npm run lint
          npm test

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/

  # --- Job 3: Dependency, Secret and Bundle Scanning (F-M20) ---
  # F-C5 and F-H15 were both findable automatically; nothing in CI looked. The repo already
  # had gitleaks and a bundle check in `make gate`, but only on a developer's machine, and
  # `make secrets` fails silently when gitleaks is not installed (F-M22).
  security-scan:
    name: Dependency and Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Advisory data changes daily, so this is reported, not gating: a new CVE in a
      # dependency must not block an unrelated hotfix. Read the summary on every run.
      - name: Audit Python dependencies (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc --strict || echo "::warning::pip-audit reported findings - see log"

      - name: Audit npm packages
        continue-on-error: true
        run: |
          for dir in sdk sdk-server telephony dashboard; do
            if [ -f "$dir/package.json" ]; then
              echo "--- $dir"
              (cd "$dir" && npm audit --audit-level=high) || echo "::warning::npm audit findings in $dir"
            fi
          done

      # A committed secret is different: that gates, because it cannot be un-leaked later.
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Check the published browser bundle holds no secrets
        run: |
          cd sdk
          npm ci
          npm run build
          if grep -rEq "(API_KEY|SECRET|SERVICE_ROLE|Bearer )" dist/; then
            echo "::error::a secret-shaped string reached the published SDK bundle"
            exit 1
          fi
          echo "bundle clean"

  # --- Job 4: Docker Container Build Smoke Test ---
  docker-smoke:
    name: Docker Container Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Control Plane Docker Image
        run: docker build -f docker/control-plane.Dockerfile -t uva-control-plane:test .

      - name: Build Worker Docker Image
        run: docker build -f docker/worker.Dockerfile -t uva-worker:test .

      - name: Build Admin Docker Image
        run: docker build -f docker/admin.Dockerfile -t uva-admin:test .
