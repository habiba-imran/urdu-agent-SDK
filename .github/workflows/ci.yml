name: CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  # --- Job 1a: Offline / mocked Python unit suite (always — P4-H1) ---
  pytest-unit:
    name: Python Unit Suite (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run offline unit suite
        env:
          CI_UNIT_FORCE_OFFLINE: "1"
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL || 'wss://test.livekit.cloud' }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY || 'test-key' }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET || 'test-secret' }}
          CP_TENANT_SECRETS: "{}"
          TENANT_SECRET_ENCRYPTION_KEY: "ci-unit-test-encryption-key"
          # Explicitly empty — run_ci_unit.py keeps it empty; DB fixtures skip.
          SUPABASE_DB_URL: ""
        run: python scripts/run_ci_unit.py

  # --- Job 1b: Full suite including DB-backed tests (when secret present) ---
  pytest-integration:
    name: Python Integration Suite (DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run full test suite (requires SUPABASE_DB_URL)
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL || 'wss://test.livekit.cloud' }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY || 'test-key' }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET || 'test-secret' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CP_TENANT_SECRETS: "{}"
          TENANT_SECRET_ENCRYPTION_KEY: "ci-integration-test-encryption-key"
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret not set — integration suite skipped (unit job still required)."
            echo "Never treat a missing DB secret as 'full CI passed'."
            exit 0
          fi
          python -m pytest tests/ -v --tb=short

  # --- Job 2: SDK Packages Build, Lint & Test ---
  sdk-build:
    name: SDK Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build, Lint & Test Browser SDK (@awaazlabs-uva/voice)
        working-directory: sdk
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      - name: Build, Lint & Test Server SDK (@awaazlabs-uva/agents)
        working-directory: sdk-server
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build, Lint & Test Telephony SDK (@awaazlabs-uva/telephony)
        working-directory: telephony
        run: |
          npm ci
          npm run lint
          npm test

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/

  # --- Job 2b: Tenant dashboard typecheck + build (P4-H3) ---
  dashboard:
    name: Dashboard Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Build voice SDK (dashboard file dependency)"
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Typecheck dashboard
        working-directory: dashboard
        run: npm run typecheck

      - name: Build dashboard
        working-directory: dashboard
        env:
          NEXT_PUBLIC_TENANT_PORTAL_API_URL: https://portal.example.test
          NEXT_PUBLIC_CONTROL_PLANE_URL: https://cp.example.test
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_LEGAL_TERMS_URL: https://example.com/legal/terms
          NEXT_PUBLIC_LEGAL_PRIVACY_URL: https://example.com/legal/privacy
          NEXT_PUBLIC_LEGAL_DPA_URL: https://example.com/legal/dpa
        run: npx next build

  # --- Job 3: Dependency, Secret and Bundle Scanning (F-M20) ---
  security-scan:
    name: Dependency and Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Advisory data changes daily, so this is reported, not gating: a new CVE in a
      # dependency must not block an unrelated hotfix. Read the summary on every run.
      - name: Audit Python dependencies (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc --strict || echo "::warning::pip-audit reported findings - see log"

      - name: Audit npm packages
        continue-on-error: true
        run: |
          for dir in sdk sdk-server telephony dashboard; do
            if [ -f "$dir/package.json" ]; then
              echo "--- $dir"
              (cd "$dir" && npm audit --audit-level=high) || echo "::warning::npm audit findings in $dir"
            fi
          done

      # A committed secret is different: that gates, because it cannot be un-leaked later.
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Check the published browser bundle holds no secrets
        run: |
          cd sdk
          npm ci
          npm run build
          # Match credential-shaped identifiers, not normal Authorization: Bearer <jwt>.
          if grep -rEq "(API_KEY|SERVICE_ROLE|LIVEKIT_API_SECRET|SUPABASE_SERVICE)" dist/; then
            echo "::error::a secret-shaped string reached the published SDK bundle"
            exit 1
          fi
          echo "bundle clean"

  # --- Job 4: Docker Container Build Smoke Test ---
  docker-smoke:
    name: Docker Container Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Control Plane Docker Image
        run: docker build -f docker/control-plane.Dockerfile -t uva-control-plane:test .

      - name: Build Worker Docker Image
        run: docker build -f docker/worker.Dockerfile -t uva-worker:test .

      - name: Build Admin Docker Image
        run: docker build -f docker/admin.Dockerfile -t uva-admin:test .

      - name: Build Tenant Portal Docker Image
        run: docker build -f docker/tenant-portal-api.Dockerfile -t uva-tenant-portal:test .
