name: Purge Expired Session Media

# F-C4: call recordings, transcripts and escalation contact details were kept forever, with no
# retention or erasure path. scripts/purge_expired_session_media.py deletes storage objects and
# clears the rows once retention expires or deletion is requested; nothing scheduled it.
# Runbook: docs/WAVE2-SESSION-MEDIA-ERASURE.md
#
# Mode: dry-run by default. Set the repository variable PURGE_APPLY to "true" to start deleting.
# This job deletes customer media permanently, so it stays opt-in rather than defaulting to
# destructive. The retention columns come from 0028_session_recording_consent_retention.sql;
# before that migration is applied the script reports the missing session columns and still
# handles telephony_calls.
#
# SUPABASE_URL / SUPABASE_SERVICE_ROLE are needed to delete the Storage objects. Without them
# the script can clear database rows but not the audio, so this fails rather than half-purging
# and marking rows deleted.

on:
  schedule:
    - cron: "30 3 * * *" # daily, 03:30 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete media (otherwise dry-run)"
        type: boolean
        default: false
      limit:
        description: "Max rows per table per run"
        type: string
        default: "200"

concurrency:
  group: purge-session-media
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    name: Purge expired session media
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]==3.3.4" python-dotenv==1.2.2 supabase==2.31.0

      - name: Resolve mode
        id: mode
        env:
          INPUT_APPLY: ${{ inputs.apply }}
          VAR_APPLY: ${{ vars.PURGE_APPLY }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          apply=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_APPLY" = "true" ]; then apply=true; fi
          elif [ "${VAR_APPLY,,}" = "true" ]; then
            apply=true
          fi
          limit="${INPUT_LIMIT:-200}"
          case "$limit" in ''|*[!0-9]*) echo "::error::limit must be a number"; exit 1 ;; esac
          echo "apply=$apply" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "apply=$apply limit=$limit"

      - name: Check credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          APPLY: ${{ steps.mode.outputs.apply }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — nothing was purged"
            exit 1
          fi
          if [ "$APPLY" = "true" ] && { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE" ]; }; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE are required to delete storage objects"
            exit 1
          fi

      - name: Purge
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          APPLY: ${{ steps.mode.outputs.apply }}
          LIMIT: ${{ steps.mode.outputs.limit }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/purge_expired_session_media.py --limit "$LIMIT"
          else
            python scripts/purge_expired_session_media.py --limit "$LIMIT" --dry-run
          fi
